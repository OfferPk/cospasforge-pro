    <text x="270" y="32" fill="#94a3b8" font-size="12" font-weight="600">BCH-1 PARITY</text>
    <text x="270" y="70" fill="#34d399" font-size="28" font-weight="800">21 <tspan font-size="16" fill="#64748b">bits</tspan></text>
