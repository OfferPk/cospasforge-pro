      <text x="36" y="326" fill="#f1f5f9" font-size="13">&#x2713; Section 3.4: Standard Location Protocol GNSS Coordinate Discretization (15-min + delta)</text>
      <text x="36" y="366" fill="#f1f5f9" font-size="13">&#x2713; ITU MID: 10-Bit National Administration Country Code Alignment (USA, UK, UAE)</text>
