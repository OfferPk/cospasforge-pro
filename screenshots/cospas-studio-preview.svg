    <text x="36" y="188" fill="#34d399" font-size="12">Lat: 25.2048&deg; N | Lon: 55.2708&deg; E</text>
    <text x="36" y="211" fill="#64748b" font-size="12">Format: Long Message (144 Bits)</text>
    <rect x="20" y="250" width="320" height="40" rx="6" fill="#0284c7"/>
